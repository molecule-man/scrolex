name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get the release version from Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version *= *' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Show the version
        run: |
          echo "version is: $VERSION"
      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Cargo.toml version ($VERSION) does not match tag (${{ github.ref_name }})" >&2
            exit 1
          fi
      - name: Check that the metainfo has a release entry for this version
        shell: bash
        run: |
          metainfo=resources/com.andr2i.scrolex.metainfo.xml
          case "$VERSION" in
            *-*)
              echo "$VERSION is a pre-release; not expected in the metainfo"
              ;;
            *)
              if ! grep -q "<release version=\"$VERSION\"" "$metainfo"; then
                echo "$metainfo has no <release version=\"$VERSION\"> entry" >&2
                exit 1
              fi
              ;;
          esac
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $VERSION --draft --verify-tag --title $VERSION
    outputs:
      version: ${{ env.VERSION }}

  build-release:
    name: build-release
    needs: ['create-release']
    runs-on: ${{ matrix.os }}
    env:
      CARGO: cargo
      # When CARGO is set to CROSS, this is set to `--target matrix.target`.
      TARGET_FLAGS:
      # When CARGO is set to CROSS, TARGET_DIR includes matrix.target.
      TARGET_DIR: ./target
      CROSS_VERSION: v0.2.5
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
        - build: linux
          os: ubuntu-24.04
          rust: stable
          target: x86_64-unknown-linux-gnu
        # - build: linux-arm64
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: aarch64-unknown-linux-gnu
        # - build: linux
        #   os: ubuntu-24.04
        #   rust: nightly
        #   target: x86_64-unknown-linux-musl
        #   strip: x86_64-linux-musl-strip
        # - build: stable-x86
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: i686-unknown-linux-gnu
        #   strip: x86_64-linux-gnu-strip
        # - build: stable-aarch64
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: aarch64-unknown-linux-gnu
        #   strip: aarch64-linux-gnu-strip
        # - build: stable-arm-gnueabihf
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: armv7-unknown-linux-gnueabihf
        #   strip: arm-linux-gnueabihf-strip
        # - build: stable-arm-musleabihf
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: armv7-unknown-linux-musleabihf
        #   strip: arm-linux-musleabihf-strip
        # - build: stable-arm-musleabi
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: armv7-unknown-linux-musleabi
        #   strip: arm-linux-musleabi-strip
        # - build: stable-powerpc64
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: powerpc64-unknown-linux-gnu
        #   strip: powerpc64-linux-gnu-strip
        # - build: stable-s390x
        #   os: ubuntu-24.04
        #   rust: stable
        #   target: s390x-unknown-linux-gnu
        #   strip: s390x-linux-gnu-strip
        # - build: macos
        #   os: macos-latest
        #   rust: nightly
        #   target: x86_64-apple-darwin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install packages (Ubuntu)
      if: matrix.os == 'ubuntu-24.04'
      shell: bash
      run: |
        ci/ubuntu-install-packages

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.target }}

    - name: Use Cross
      if: matrix.os == 'ubuntu-24.04' && matrix.use_cross
      shell: bash
      run: |
        cat <<EOF > Cross.toml
        [target.${{ matrix.target }}]
        pre-build = [
            "dpkg --add-architecture \$CROSS_DEB_ARCH",
            "apt-get update && apt-get install --assume-yes libgtk-4-dev:\$CROSS_DEB_ARCH clang"
        ]
        EOF
        cat Cross.toml
        dir="$RUNNER_TEMP/cross-download"
        mkdir "$dir"
        echo "$dir" >> $GITHUB_PATH
        cd "$dir"
        curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
        tar xf cross-x86_64-unknown-linux-musl.tar.gz
        echo "CARGO=cross" >> $GITHUB_ENV

    - name: Set target variables
      shell: bash
      run: |
        echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
        echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

    - name: Show command used for Cargo
      shell: bash
      run: |
        echo "cargo command is: ${{ env.CARGO }}"
        echo "target flag is: ${{ env.TARGET_FLAGS }}"
        echo "target dir is: ${{ env.TARGET_DIR }}"

    - name: Build release binary
      shell: bash
      run: |
        ${{ env.CARGO }} build --verbose --release ${{ env.TARGET_FLAGS }}
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          bin="target/${{ matrix.target }}/release/scrolex.exe"
        else
          bin="target/${{ matrix.target }}/release/scrolex"
        fi
        echo "BIN=$bin" >> $GITHUB_ENV

    - name: Strip release binary (macos)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: strip "$BIN"

    - name: Strip release binary (cross)
      if: env.CARGO == 'cross'
      shell: bash
      run: |
        docker run --rm -v \
          "$PWD/target:/target:Z" \
          "ghcr.io/cross-rs/${{ matrix.target }}:main" \
          "${{ matrix.strip }}" \
          "/$BIN"

    - name: Determine archive name
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        echo "ARCHIVE=scrolex-$version-${{ matrix.target }}" >> $GITHUB_ENV

    - name: Creating directory for archive
      shell: bash
      run: |
        mkdir -p "$ARCHIVE"
        cp "$BIN" "$ARCHIVE"/
        cp LICENSE README.md "$ARCHIVE"/
        cp -r ./resources/ "$ARCHIVE"/

    - name: Build archive
      shell: bash
      run: |
        tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
        shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
        echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV

    - name: Upload release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        gh release upload "$version" ${{ env.ASSET }} ${{ env.ASSET_SUM }}

  build-release-deb:
    name: build-release-deb
    needs: ['create-release']
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
      TARGET: x86_64-unknown-linux-gnu
      DEB_DIR: target/debian

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install packages (Ubuntu)
      shell: bash
      run: |
        ci/ubuntu-install-packages

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        target: ${{ env.TARGET }}

    - name: Install cargo-deb
      shell: bash
      run: |
        cargo install cargo-deb

    - name: Build release binary
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        DEB_NAME=scrolex_$version.deb
        echo "DEB_NAME=$DEB_NAME" >> $GITHUB_ENV
        cargo deb --profile deb --target ${{ env.TARGET }} -o ${{ env.DEB_DIR }}/$DEB_NAME

    - name: Create sha256 sum of deb file
      shell: bash
      run: |
        cd "$DEB_DIR"
        sum="$DEB_NAME.sha256"
        shasum -a 256 "$DEB_NAME" > "$sum"
        echo "SUM=$sum" >> $GITHUB_ENV

    - name: Upload release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        cd "$DEB_DIR"
        version="${{ needs.create-release.outputs.version }}"
        gh release upload "$version" "$DEB_NAME" "$SUM"

  build-release-flatpak:
    name: build-release-flatpak
    needs: ['create-release']
    runs-on: ubuntu-24.04
    env:
      APP_ID: com.andr2i.scrolex
      MANIFEST: packaging/flatpak/com.andr2i.scrolex.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install flatpak-builder
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --assume-yes flatpak flatpak-builder
        flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

    - name: Pin app source to release tag
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        sed -i "s/branch: main/tag: $version/" "$MANIFEST"

    - name: Build Flatpak bundle
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        BUNDLE=scrolex_$version.flatpak
        echo "BUNDLE=$BUNDLE" >> $GITHUB_ENV
        # ubuntu-24.04 restricts unprivileged user namespaces, which bwrap needs
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub \
          --repo=repo --force-clean build-dir "$MANIFEST"
        flatpak build-bundle repo "$BUNDLE" "$APP_ID" \
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

    - name: Create sha256 sum of flatpak bundle
      shell: bash
      run: |
        sum="$BUNDLE.sha256"
        shasum -a 256 "$BUNDLE" > "$sum"
        echo "SUM=$sum" >> $GITHUB_ENV

    - name: Upload release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        version="${{ needs.create-release.outputs.version }}"
        gh release upload "$version" "$BUNDLE" "$SUM"

  build-release-windows:
    name: build-release-windows
    needs: ['create-release']
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1
      GVSBUILD_VERSION: 2026.8.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # pkg-config.exe ships inside the gvsbuild zip, so only libclang is missing.
    - name: Install LLVM
      run: choco install -y --no-progress llvm

    - name: Cache GTK4 runtime
      id: gtk-cache
      uses: actions/cache@v4
      with:
        path: C:\gtk
        key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}

    - name: Download GTK4 runtime
      if: steps.gtk-cache.outputs.cache-hit != 'true'
      run: |
        $url = "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/GTK4_Gvsbuild_${env:GVSBUILD_VERSION}_x64.zip"
        Invoke-WebRequest -Uri $url -OutFile gtk4.zip
        7z x gtk4.zip -oC:\gtk

    # bindgen runs libclang over MuPDF headers, so it needs the CRT and SDK include paths.
    - name: Set MSVC environment
      shell: cmd
      run: |
        rem -products is required: vswhere skips Build Tools installs without it.
        pushd "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer"
        for /f "usebackq tokens=*" %%i in (`vswhere.exe -latest -products "*" -property installationPath`) do set "VSPATH=%%i"
        popd
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
        echo INCLUDE=%INCLUDE%>> %GITHUB_ENV%
        echo LIB=%LIB%>> %GITHUB_ENV%
        echo LIBPATH=%LIBPATH%>> %GITHUB_ENV%

    - name: Set GTK environment
      run: |
        "C:\gtk\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        @(
          "PKG_CONFIG_PATH=C:\gtk\lib\pkgconfig"
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable

    - name: Build release binary
      run: cargo build --verbose --release

    - name: Bundle the GTK runtime into a portable zip
      run: powershell -ExecutionPolicy Bypass -File ci\win-bundle.ps1

    # Get-FileHash, not shasum: powershell is always there, and this writes the same
    # "<hash>  <file>" line that shasum -a 256 writes for the other platforms.
    - name: Create sha256 sum of the zip
      run: |
        $version = "${{ needs.create-release.outputs.version }}"
        $name = "scrolex-$version-x86_64-windows.zip"
        $asset = "dist\$name"
        if (-not (Test-Path $asset)) { throw "the bundle step did not produce $asset" }
        $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
        "$hash  $name" | Out-File -FilePath "$asset.sha256" -Encoding ascii
        @("ASSET=$asset", "ASSET_SUM=$asset.sha256") |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Upload release archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ needs.create-release.outputs.version }}" "$env:ASSET" "$env:ASSET_SUM"

    # After the zip is uploaded, so a missing SDK cannot cost the release asset.
    # The msix is not a release asset. It goes to the Store, which re-signs it.
    - name: Build the msix
      run: powershell -ExecutionPolicy Bypass -File ci\win-msix.ps1

    - name: Upload the msix as a workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: msix
        path: dist/*.msix
        if-no-files-found: error
