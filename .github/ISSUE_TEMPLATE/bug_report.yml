name: Bug Report
description: Report a problem with scrolex
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current behavior. May include logs, images, or videos.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If possible, attach a PDF that triggers the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the behavior you expect.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: scrolex version
      description: |
        Open the settings menu, click "About Scrolex", then click the version to copy it.
        The copied text also holds your OS, install method and GTK version. On Linux you
        can run `scrolex --version` instead.
      placeholder: "scrolex 0.6.1"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install scrolex?
      options:
        - Flatpak
        - AUR (scrolex-bin)
        - .deb package from GitHub Releases
        - Linux binary archive from GitHub Releases
        - Microsoft Store
        - Windows zip from GitHub Releases
        - Built from source (cargo)
        - Other (specify in Problem)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / distribution
      placeholder: "e.g. Arch Linux, Fedora 40, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: TRACE logs
      description: |
        Reproduce the bug with TRACE logging enabled and paste the output.

        Linux:

        ```
        RUST_LOG=scrolex=trace scrolex your-file.pdf
        ```

        (Flatpak: `flatpak run --env=RUST_LOG=scrolex=trace com.andr2i.scrolex your-file.pdf`)

        Windows: scrolex writes the log to a file. Set the level, start scrolex
        again, reproduce the bug, then attach the file.

        ```
        setx RUST_LOG scrolex=trace
        ```

        The log file is `%LOCALAPPDATA%\scrolex\scrolex.log`. Paste this path in
        the Explorer address bar to open the folder. Every launch truncates the
        file, so it holds one session. To stop the trace logs, run
        `setx RUST_LOG ""`.
      render: text
    validations:
      required: true
