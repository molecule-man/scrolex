[package]
name = "scrolex"
version = "0.13.0"
edition = "2021"
authors = ["Andrii Berezhynskyi <microsolutions_harebrain@aleeas.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/molecule-man/scrolex"
repository = "https://github.com/molecule-man/scrolex"
description = "A Horizontally Scrolled PDF Viewer"

[dependencies]
env_logger = "0.11.5"
futures = "0.3.30"
glib = { version = "0.22", features = ["log", "v2_72"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
log = "0.4"
# Pinned past 0.8.0 for the process-wide system font cache (mupdf-rs #262, issue #87)
# and system CJK fonts on Linux (#265).
# Go back to a crates.io version when one ships with it.
# Only the features we use. brotli stays off until mupdf-rs ships MuPDF 1.28
# (#261): the vendored decoder has CVE-2026-111497 (mupdf-rs #278).
mupdf = { git = "https://github.com/messense/mupdf-rs", rev = "537d50556ee8e4abf2435f81357dfef3c145d883", default-features = false, features = [
    "xps",
    "svg",
    "cbz",
    "img",
    "html",
    "epub",
    "system-fonts",
    "base14-fonts",
] }
once_cell = "1.19.0"
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.22"

[features]
# Gates criterion and its 35 crates out of every build that is not a benchmark run.
# criterion sits in [dependencies] because cargo cannot make a dev-dependency optional.
bench = ["dep:criterion"]

[dependencies.criterion]
version = "0.8"
features = ["html_reports"]
optional = true

[[bench]]
name = "benchmarks"
harness = false
required-features = ["bench"]

[profile.deb]
inherits = "release"
debug = false

[package.metadata.deb]
assets = [
	["target/release/scrolex", "usr/bin/", "755"],
	["resources/com.andr2i.scrolex.desktop", "usr/share/applications/", "644"],
	["resources/icon-64.png", "usr/share/icons/hicolor/64x64/apps/com.andr2i.scrolex.png", "644"],
	["resources/icon-128.png", "usr/share/icons/hicolor/128x128/apps/com.andr2i.scrolex.png", "644"],
	["resources/icon-256.png", "usr/share/icons/hicolor/256x256/apps/com.andr2i.scrolex.png", "644"],
	["resources/icon-512.png", "usr/share/icons/hicolor/512x512/apps/com.andr2i.scrolex.png", "644"],
	["resources/com.andr2i.scrolex.metainfo.xml", "usr/share/metainfo/", "644"],
	["THIRD_PARTY_LICENSES.md", "usr/share/licenses/scrolex/", "644"],
	["licenses/Qogir-icon-theme-GPL-3.0.txt", "usr/share/licenses/scrolex/", "644"]
]
