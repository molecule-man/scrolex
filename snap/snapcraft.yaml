name: scrolex
base: core24
adopt-info: scrolex
license: AGPL-3.0-or-later
confinement: strict
grade: stable

apps:
  scrolex:
    command: bin/scrolex
    extensions: [gnome]
    common-id: com.andr2i.scrolex
    desktop: usr/share/applications/com.andr2i.scrolex.desktop
    plugs:
      - home
      - removable-media

parts:
  # The core24 rust plugin needs rustup. It looks for a part with this name.
  rust-deps:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
      ln -sf "$HOME/.cargo/bin/rustup" /usr/local/bin/rustup
      ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo

  scrolex:
    after: [rust-deps]
    plugin: rust
    rust-channel: stable
    source: .
    parse-info: [usr/share/metainfo/com.andr2i.scrolex.metainfo.xml]
    build-packages:
      # mupdf-sys compiles its bundled C library and runs bindgen.
      - clang
      - libclang-dev
      # build.rs calls glib-compile-resources.
      - libglib2.0-dev-bin
    override-build: |
      craftctl default
      # Cargo.toml is the one place ci/bump-version writes the version.
      craftctl set version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
      install -Dm644 resources/com.andr2i.scrolex.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.andr2i.scrolex.desktop"
      install -Dm644 resources/com.andr2i.scrolex.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.andr2i.scrolex.metainfo.xml"
      for size in 64 128 256 512; do
        install -Dm644 "resources/icon-$size.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps/com.andr2i.scrolex.png"
      done
